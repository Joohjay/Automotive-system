# BennyBlax Nginx virtual-host template.
#
# Do NOT edit the rendered file on the server — edit this template and
# re-run `deploy/setup-app.sh <app-id>`.
#
# Placeholders are substituted with envsubst using the EXPLICIT variable list
# below, so Nginx runtime variables ($host, $request_uri, $remote_addr, $uri,
# $scheme, $proxy_add_x_forwarded_for) are left untouched.
#
# Placeholders: ${APP_HOSTNAME} ${APP_PATH} ${API_PORT} ${APP_LOG_DIR}

# --- HTTP -> HTTPS redirect (required for Let's Encrypt issuance) -------
server {
    listen 80;
    listen [::]:80;
    server_name ${APP_HOSTNAME};

    access_log ${APP_LOG_DIR}/nginx-access.log;
    error_log  ${APP_LOG_DIR}/nginx-error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS server --------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${APP_HOSTNAME};

    ssl_certificate     /etc/letsencrypt/live/${APP_HOSTNAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${APP_HOSTNAME}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 1m;
    client_body_timeout   30s;
    client_header_timeout 30s;
    proxy_read_timeout    60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;

    # Security headers (Helmet also sets its own on API responses).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    access_log ${APP_LOG_DIR}/nginx-access.log;
    error_log  ${APP_LOG_DIR}/nginx-error.log;

    # Frontend static build (client/dist after `npm run build`).
    root ${APP_PATH}/client/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API on the same origin (no CORS needed). Proxies to the app's own port.
    location /api/ {
        proxy_pass http://127.0.0.1:${API_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}