name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autoparts
          POSTGRES_PASSWORD: autoparts
          POSTGRES_DB: autoparts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 43101
      DATABASE_URL: postgresql://autoparts:autoparts@localhost:5432/autoparts_test?statement_timeout=30000
      JWT_SECRET: ci-test-jwt-secret-that-is-long-enough-for-hmac-sha256-0123456789abcdef
      AUTH_LOGIN_LIMIT: "100"
      AUTH_GLOBAL_LIMIT: "2000"
      CLIENT_ORIGIN: http://localhost:4100
      EMAIL_PROVIDER: console

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Push schema to test DB
        working-directory: server
        run: npx prisma db push --accept-data-loss

      - name: Seed test database
        working-directory: server
        run: npx tsx prisma/seed.ts

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Build
        working-directory: server
        run: npm run build

      - name: Unit tests
        working-directory: server
        run: npm test

      - name: Integration tests
        working-directory: server
        run: node --test tests/security.integration.test.mjs
        timeout-minutes: 3

      - name: Audit (non-blocking)
        working-directory: server
        run: npm audit --audit-level=high || true

  client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Typecheck
        working-directory: client
        run: npx tsc --noEmit

      - name: Build
        working-directory: client
        run: npm run build
